<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" fill="none" role="img" aria-label="Okta Agentic Patterns">
  <defs>
    <path id="logo-top-arc" d="M 50,110 A 60,60 0 1 1 170,110" />
    <path id="logo-bot-arc" d="M 50,110 A 60,60 0 1 0 170,110" />
    <filter id="logo-glow-cyan" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.4" flood-color="#22d3ee" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#22d3ee" flood-opacity="0.3" />
    </filter>
    <filter id="logo-glow-purple" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.4" flood-color="#a855f7" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#a855f7" flood-opacity="0.3" />
    </filter>
  </defs>

  <text filter="url(#logo-glow-cyan)" fill="#22d3ee" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" dominant-baseline="central">
    <textPath href="#logo-top-arc" startOffset="50%" text-anchor="middle" textLength="166" lengthAdjust="spacing">OKTA AGENTIC</textPath>
  </text>
  <text filter="url(#logo-glow-purple)" fill="#a855f7" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" dominant-baseline="central">
    <textPath href="#logo-bot-arc" startOffset="50%" text-anchor="middle" textLength="166" lengthAdjust="spacing">PATTERNS</textPath>
  </text>

  <g filter="url(#logo-glow-cyan)" transform="translate(110,110) scale(0.78)">
    <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" stroke="#22d3ee" stroke-width="3.5" stroke-linejoin="round" />
    <line x1="0" y1="-25" x2="0" y2="0" stroke="#22d3ee" stroke-width="3" />
    <line x1="0" y1="0" x2="25" y2="12" stroke="#22d3ee" stroke-width="3" />
    <line x1="0" y1="0" x2="-25" y2="12" stroke="#22d3ee" stroke-width="3" />
    <line x1="0" y1="0" x2="0" y2="28" stroke="#22d3ee" stroke-width="3" />
    <circle cx="0" cy="-25" r="6" fill="#0d1117" stroke="#22d3ee" stroke-width="3" />
    <circle cx="0" cy="0" r="5" fill="#22d3ee" />
    <circle cx="25" cy="12" r="6" fill="#0d1117" stroke="#22d3ee" stroke-width="3" />
    <circle cx="-25" cy="12" r="6" fill="#0d1117" stroke="#22d3ee" stroke-width="3" />
    <circle cx="0" cy="28" r="6" fill="#0d1117" stroke="#22d3ee" stroke-width="3" />
  </g>
</svg>
